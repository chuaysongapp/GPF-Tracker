<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<title>ระบบติดตามการลงทุน กบข.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
  :root{
    --bg:#eef1f4; --card:#ffffff; --ink:#152029; --muted:#657280; --line:#e2e7ec;
    --brand:#0f766e; --brand-dk:#0b5a54; --warn:#d97706; --warn-bg:#fff6e8;
    --up:#0f766e; --down:#be123c;
    --fx:#4338ca; --th:#0891b2; --gold:#d4a017; --prop:#be123c; --bond:#64748b;
    --shadow:0 1px 2px rgba(21,32,41,.06),0 8px 24px rgba(21,32,41,.06);
    --nav-h:64px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  .hide{display:none!important}
  .mono{font-variant-numeric:tabular-nums}

  #lock{position:fixed;inset:0;background:linear-gradient(160deg,#0b5a54,#0f766e 55%,#12908a);
    display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:60;color:#fff;padding:20px}
  #lock .logo{font-size:14px;opacity:.85}
  #lock h1{font-size:22px;font-weight:600;margin:6px 0 2px}
  #lock .sub{font-size:13px;opacity:.8;margin-bottom:30px}
  .dots{display:flex;gap:14px;margin-bottom:30px}
  .dots span{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.6);transition:.15s}
  .dots span.on{background:#fff;border-color:#fff}
  .dots.err span{border-color:#fecaca}
  .pad{display:grid;grid-template-columns:repeat(3,64px);gap:16px}
  .pad button{height:64px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;font-size:22px;font-weight:500;transition:.12s}
  .pad button:active{background:rgba(255,255,255,.28);transform:scale(.96)}
  .pad .ghost{border:none;background:none}
  .bio-btn{width:96px;height:96px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.10);color:#fff;display:flex;align-items:center;justify-content:center;margin:6px auto 18px;transition:.15s}
  .bio-btn:active{background:rgba(255,255,255,.25);transform:scale(.96)}
  .bio-btn svg{width:48px;height:48px}
  #bioBox{display:flex;flex-direction:column;align-items:center}
  .link{background:none;border:none;color:#fff;opacity:.85;font-size:13px;text-decoration:underline;padding:8px;margin-top:6px}
  @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
  .shake{animation:shake .5s}

  header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
  header .brand{width:36px;height:36px;border-radius:10px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
  header .ttl{font-weight:600;font-size:15px;line-height:1.2}
  header .ttl small{display:block;color:var(--muted);font-weight:400;font-size:12px}
  main{max-width:900px;margin:0 auto;padding:18px 16px calc(var(--nav-h) + 24px)}

  .banner{display:flex;gap:12px;align-items:center;background:var(--warn-bg);border:1px solid #f4d29a;border-left:4px solid var(--warn);border-radius:12px;padding:13px 15px;margin-bottom:16px}
  .banner .b-txt{font-size:13px;line-height:1.5;color:#7a4a05}.banner .b-txt b{color:#9a5b03}
  .banner button{margin-left:auto;white-space:nowrap;background:var(--warn);color:#fff;border:none;border-radius:9px;padding:9px 13px;font-size:13px;font-weight:600}

  .hero{background:linear-gradient(160deg,#0b5a54,#0f766e 60%,#12908a);color:#fff;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
  .hero .h-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .hero .h-top .lab{font-size:13px;opacity:.9}
  .hero .h-top .memberbadge{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px}
  .hero .h-top .upd{margin-left:auto;background:#fff;color:var(--brand-dk);border:none;border-radius:9px;padding:9px 14px;font-size:13px;font-weight:600}
  .hero .big{font-size:36px;font-weight:700;line-height:1}
  .hero .big small{font-size:15px;font-weight:400;opacity:.85}
  .hero .asof{font-size:12.5px;opacity:.8;margin-top:6px}
  .hero .bench{margin-top:14px;background:rgba(255,255,255,.12);border:1px dashed rgba(255,255,255,.4);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.5}
  .hero .bench .r{font-size:22px;font-weight:700}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
  .card h2{font-size:15px;margin:0 0 2px;font-weight:600}
  .card .cap{font-size:12.5px;color:var(--muted);margin:0 0 14px}
  .card .h-flex{display:flex;align-items:center;gap:8px}
  .card .h-flex h2{flex:1}
  .mini-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font-size:12.5px;color:var(--ink)}

  .breakdown{width:100%;border-collapse:collapse;font-size:13.5px}
  .breakdown td{padding:9px 4px;border-bottom:1px solid #f0f3f6}
  .breakdown td:last-child{text-align:right;font-variant-numeric:tabular-nums}
  .breakdown tr.benefit td{background:#f2fbf8;font-weight:600;color:var(--brand-dk)}
  .breakdown tr.total td{border-top:2px solid var(--line);border-bottom:none;font-weight:700;font-size:15px;padding-top:11px}
  .gainline{margin-top:12px;font-size:13px;color:var(--muted)}.gainline b{color:var(--up)}

  .seg{display:flex;background:#eef1f4;border-radius:11px;padding:4px;gap:4px;margin-bottom:14px}
  .seg button{flex:1;border:none;background:none;border-radius:8px;padding:9px 4px;font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
  .seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
  .alloc-wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .donut-box{width:140px;height:140px;flex:none;margin:auto}
  table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
  table.tbl th,table.tbl td{padding:7px 5px;text-align:right}
  table.tbl th:first-child,table.tbl td:first-child{text-align:left}
  table.tbl thead th{color:var(--muted);font-weight:500;font-size:11px;border-bottom:1px solid var(--line)}
  table.tbl tbody td{border-bottom:1px solid #f0f3f6}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .drift{font-weight:600}.drift.over{color:var(--warn)}.drift.ok{color:var(--up)}.drift.zero{color:var(--muted)}

  .kpis{display:flex;gap:20px;margin-bottom:12px;flex-wrap:wrap}
  .kpi .v{font-size:20px;font-weight:700}.kpi .v.pos{color:var(--up)}.kpi .v.neg{color:var(--down)}
  .kpi .l{font-size:12px;color:var(--muted)}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:24px 8px;line-height:1.6}

  .glide{position:relative;margin:20px 4px 6px}
  .track{height:10px;border-radius:6px;background:#e7ebef;position:relative;overflow:hidden}
  .zone{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#fde3c0,#fde3c0 6px,#fbd7a6 6px,#fbd7a6 12px)}
  .fill{position:absolute;top:0;bottom:0;left:0;background:var(--brand);border-radius:6px}
  .marker{position:absolute;top:-8px;width:2px;height:26px;background:var(--ink)}
  .marker .flag{position:absolute;top:-19px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:11px;padding:2px 7px;border-radius:6px;white-space:nowrap}
  .ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:14px}
  .glide-note{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.55}.glide-note b{color:var(--ink)}
  .add-btn{border:1px dashed var(--line);background:#fafbfc;color:var(--brand);width:100%;border-radius:10px;padding:11px;font-size:13.5px;font-weight:600;margin-top:4px}

  .mcard .top{display:flex;align-items:center;gap:9px;margin-bottom:2px}
  .mcard .top .sq{width:10px;height:10px;border-radius:3px}
  .mcard .top h3{font-size:14px;margin:0;font-weight:600}
  .mcard .top .badge{margin-left:auto;font-size:10.5px;padding:2px 8px;border-radius:20px;font-weight:600}
  .badge.live{background:#e7f6ee;color:#16794c}.badge.close{background:#eef1f4;color:#657280}.badge.wait{background:#fff1e8;color:#b4590a}
  .mcard .src{font-size:11px;color:var(--muted);margin:0 0 10px}
  .mcard .row{display:flex;align-items:flex-end;gap:12px}
  .mcard .price{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
  .mcard .unit{font-size:12px;color:var(--muted);margin-left:2px}
  .mcard .chg{font-size:13px;font-weight:600;padding-bottom:2px}
  .chg.up{color:var(--up)}.chg.down{color:var(--down)}
  .mcard .sub{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}.mcard .sub b{color:var(--ink)}

  .slist{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:16px}
  .srow{display:flex;align-items:center;gap:12px;padding:15px 16px;border-bottom:1px solid #f0f3f6;width:100%;background:none;border-left:none;border-right:none;border-top:none;text-align:left;font-size:14px}
  .srow:last-child{border-bottom:none}
  .srow .ic{width:20px;text-align:center}
  .srow .t{flex:1}.srow .t small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  .srow .chev{color:#c4ccd3}
  .srow.danger{color:var(--down)}

  nav{position:fixed;left:0;right:0;bottom:0;height:var(--nav-h);background:var(--card);border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:500}
  nav button.on{color:var(--brand)}
  nav button svg{width:22px;height:22px}
  .swal2-popup{font-family:"IBM Plex Sans Thai",sans-serif!important}
  .swal-lbl{font-size:12.5px;color:#657280;text-align:left;margin:10px 0 3px}
  .swal-inp{width:100%;padding:9px;border:1px solid #e2e7ec;border-radius:8px;font-family:inherit;text-align:right}
  .swal-inp.l{text-align:left}
</style>
</head>
<body>

<div id="lock">
  <div class="logo">กองทุนบำเหน็จบำนาญข้าราชการ</div>
  <h1 id="lockTitle">ระบบติดตามการลงทุน</h1>
  <div class="sub" id="lockSub">ใส่ PIN 6 หลัก</div>
  <div id="bioBox" class="hide">
    <button id="bioBtn" class="bio-btn" onclick="tryBio()" aria-label="สแกนลายนิ้วมือ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10c0 4-.5 6-1.5 8"/><path d="M8 8.5A5 5 0 0117 12c0 3-.3 5-.9 7"/><path d="M6.5 12a5.5 5.5 0 0111 0c0 2-.2 4-.7 6"/><path d="M9.5 12a2.5 2.5 0 015 0c0 3-.3 5-1 7.5"/><path d="M4.2 9A8 8 0 0120 12"/></svg>
    </button>
    <button class="link" onclick="usePinInstead()">ใช้ PIN แทน</button>
  </div>
  <div id="pinBox">
    <div class="dots" id="dots"><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <div class="pad" id="pad"></div>
    <button id="scanLink" class="link hide" onclick="scanAgain()">↺ สแกนลายนิ้วมือ / Face</button>
  </div>
</div>

<div id="app" class="hide">
  <header>
    <div class="brand">กบ</div>
    <div class="ttl" id="hdrTitle">พอร์ต<small id="hdrSub">เงินออม กบข.</small></div>
  </header>
  <main>
    <section id="view-portfolio"></section>
    <section id="view-market" class="hide"></section>
    <section id="view-settings" class="hide"></section>
  </main>
  <nav id="nav">
    <button data-v="portfolio" class="on" onclick="switchView('portfolio')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>พอร์ต</button>
    <button data-v="market" onclick="switchView('market')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V9m5 10V5m5 14v-7m5 7V4"/></svg>รายงานตลาด</button>
    <button data-v="settings" onclick="switchView('settings')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-2.82 1.17V21a2 2 0 01-4 0v-.09A1.65 1.65 0 007 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15H4.5a2 2 0 010-4h.09A1.65 1.65 0 006 9.4l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 0011 7h.09A1.65 1.65 0 0012 4.6V4.5a2 2 0 014 0v.09A1.65 1.65 0 0018 6.6l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0021 11h.09a2 2 0 010 4z"/></svg>ตั้งค่า</button>
  </nav>
</div>

<script>
const ASSETS=[
  {key:'fx',name:'หุ้นต่างประเทศ',color:'#4338ca'},
  {key:'th',name:'หุ้นไทย',color:'#0891b2'},
  {key:'gold',name:'ทองคำ',color:'#d4a017'},
  {key:'prop',name:'กองอสังหาฯ ไทย',color:'#be123c'},
  {key:'bond',name:'ตราสารหนี้ ตปท.',color:'#64748b'},
];
const PRESETS={
  'เดิม':{fx:50,th:30,gold:10,prop:10,bond:0},
  'A · Global':{fx:65,th:15,gold:5,prop:10,bond:0},
  'B · เชิงรุก-กระจาย':{fx:55,th:15,gold:5,prop:10,bond:15},
};
const BAND=5;
const enc=new TextEncoder();
const baht=(n,d=2)=>'฿'+(+n).toLocaleString('th-TH',{minimumFractionDigits:d,maximumFractionDigits:d});
const nf=(n,d=0)=>(+n).toLocaleString('th-TH',{minimumFractionDigits:d,maximumFractionDigits:d});
const nowTs=()=>Date.now();

const dbP=new Promise((res,rej)=>{
  const r=indexedDB.open('gpfTracker',1);
  r.onupgradeneeded=e=>{ if(!e.target.result.objectStoreNames.contains('kv')) e.target.result.createObjectStore('kv'); };
  r.onsuccess=e=>res(e.target.result); r.onerror=e=>rej(e.target.error);
});
async function kvGet(k){const db=await dbP;return new Promise((res,rej)=>{const t=db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error);});}
async function kvSet(k,v){const db=await dbP;return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}

const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const fromB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pin,salt,iter){
  const key=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},key,256);
  return b64(bits);
}
async function makePin(pin){const salt=crypto.getRandomValues(new Uint8Array(16));const iter=210000;const hash=await derive(pin,salt,iter);return{salt:b64(salt.buffer),iter,hash};}
async function checkPin(pin,rec){const h=await derive(pin,fromB64(rec.salt),rec.iter);return h===rec.hash;}

let S=null;
function defaultState(){return{
  pin:null,
  bio:{enabled:false,credId:null},
  gpf:{total:0,asof:'',avgReturn:0,contrib:{save:0,match:0,comp:0,initial:0}},
  mix:{fx:50,th:30,gold:10,prop:10,bond:0},
  targetKey:'A · Global',
  values:[], contribLog:[], lastUpdate:0,
  profile:{years:20,derisk:7,startBE:2568},
  market:{csvUrl:'',gold:null,goldPrev:null,goldAt:0,manual:{}}
};}
async function save(){await kvSet('state',S);}
const contribSum=()=>{const c=S.gpf.contrib;return c.save+c.match+c.comp+c.initial;};
const benefit=()=>S.gpf.total-contribSum();

let currentView='portfolio';
async function boot(){
  buildPad();
  S=await kvGet('state');
  if(!S){ await firstRun(); } else { openLock(); }
  if('serviceWorker' in navigator){ try{ await navigator.serviceWorker.register('./sw.js'); }catch(e){} }
}

async function firstRun(){
  document.getElementById('lock').classList.add('hide');
  await Swal.fire({title:'ยินดีต้อนรับ',html:'<div style="font-size:13.5px;line-height:1.6;color:#657280">ตั้งค่าเริ่มต้นระบบติดตามการลงทุน กบข.<br>ข้อมูลทั้งหมดเก็บในเครื่องคุณเท่านั้น</div>',confirmButtonText:'เริ่ม',confirmButtonColor:'#0f766e',allowOutsideClick:false});
  let pinRec=null;
  while(!pinRec){
    const r=await Swal.fire({title:'ตั้ง PIN 6 หลัก',html:`<input id="p1" class="swal-inp" inputmode="numeric" maxlength="6" placeholder="PIN" type="password" style="text-align:center;letter-spacing:8px;font-size:20px">
      <input id="p2" class="swal-inp" inputmode="numeric" maxlength="6" placeholder="ยืนยัน PIN" type="password" style="text-align:center;letter-spacing:8px;font-size:20px;margin-top:10px">`,
      confirmButtonText:'ถัดไป',confirmButtonColor:'#0f766e',allowOutsideClick:false,
      preConfirm:()=>{const a=document.getElementById('p1').value,b=document.getElementById('p2').value;
        if(!/^\d{6}$/.test(a)){Swal.showValidationMessage('PIN ต้องเป็นตัวเลข 6 หลัก');return false;}
        if(a!==b){Swal.showValidationMessage('PIN ไม่ตรงกัน');return false;} return a;}});
    if(r.isConfirmed){ pinRec=await makePin(r.value); }
  }
  const g=await Swal.fire({title:'ข้อมูลเงินออม กบข.',html:initialGpfForm(),confirmButtonText:'ถัดไป',confirmButtonColor:'#0f766e',allowOutsideClick:false,width:430,preConfirm:readGpfForm});
  const m=await Swal.fire({title:'สัดส่วนผสมเองปัจจุบัน (%)',html:mixForm({fx:50,th:30,gold:10,prop:10,bond:0}),confirmButtonText:'เสร็จ',confirmButtonColor:'#0f766e',allowOutsideClick:false,width:420,preConfirm:readMixForm});
  S=defaultState();
  S.pin=pinRec;
  if(g.value){ S.gpf=g.value; if(g.value.asof) S.values=[{m:g.value.asof,v:g.value.total}]; }
  if(m.value){ S.mix=m.value; }
  S.lastUpdate=nowTs();
  await save(); enterApp();
  Swal.fire({toast:true,position:'top-end',icon:'success',title:'ตั้งค่าเสร็จแล้ว',showConfirmButton:false,timer:1600});
}
function initialGpfForm(){return`<div style="max-width:340px;margin:auto">
  <div class="swal-lbl">ยอดเงินรวม กบข. (บาท)</div><input id="g_total" type="number" class="swal-inp" placeholder="164412.20">
  <div class="swal-lbl">ณ วันที่ (เช่น 1 ก.ย. 69)</div><input id="g_asof" class="swal-inp l" placeholder="1 ก.ย. 69">

async function bioSupported(){
  try{ return !!window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); }
  catch(e){ return false; }
}
async function registerBio(){
  const challenge=crypto.getRandomValues(new Uint8Array(32));
  const userId=crypto.getRandomValues(new Uint8Array(16));
  const cred=await navigator.credentials.create({publicKey:{
    challenge, rp:{name:'กบข. Tracker', id:location.hostname},
    user:{id:userId, name:'gpf-user', displayName:'GPF Tracker'},
    pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
    authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},
    timeout:60000, attestation:'none'}});
  return b64(cred.rawId);
}
async function tryBio(){
  if(!(S&&S.bio&&S.bio.enabled&&S.bio.credId))return false;
  try{
    const challenge=crypto.getRandomValues(new Uint8Array(32));
    await navigator.credentials.get({publicKey:{challenge,timeout:60000,userVerification:'required',
      allowCredentials:[{type:'public-key',id:fromB64(S.bio.credId)}]}});
    enterApp(); return true;
  }catch(e){ return false; }
}

  if(pin.length<6){pin+=v;paintDots();}

    if(ok){enterApp();}
    else{const d=dotsEl();d.classList.add('err','shake');setTimeout(()=>{d.classList.remove('shake');pin='';paintDots();},500);}
  }
}

  const waitSrc=hasCsv?('GAS'+dd):'ตั้ง URL ข้อมูลตลาดในแท็บตั้งค่า';
  const cards=[goldCard,
    marketCard({name:'หุ้นไทย (SET)',color:'#0891b2',state:d.set!=null?'close':'wait',src:d.set!=null?('GAS · ^SET.BK'+dd):waitSrc,price:d.set!=null?d.set:null,dec:2,unit:'จุด',chg:d.set_chg!=null?d.set_chg:null}),
    marketCard({name:'หุ้นต่างประเทศ (S&P 500)',color:'#4338ca',state:d.sp!=null?'close':'wait',src:d.sp!=null?('GAS · ^GSPC'+dd):waitSrc,price:d.sp!=null?d.sp:null,dec:0,unit:'จุด',chg:d.sp_chg!=null?d.sp_chg:null}),
    marketCard({name:'ตราสารหนี้ (US 10Y)',color:'#64748b',state:d.us10y!=null?'close':'wait',src:d.us10y!=null?('GAS · ^TNX'+dd):waitSrc,price:d.us10y!=null?d.us10y:null,dec:2,unit:'%',chg:d.us10y_chg!=null?d.us10y_chg:null}),
  ].join('');
  const note=hasCsv?'':`<div class="card" style="background:#f7f9fb"><div style="font-size:12.5px;color:#657280;line-height:1.6"><b>เชื่อมข้อมูลรายวัน:</b> ตั้งค่า URL ข้อมูลตลาด (GAS) ในแท็บ “ตั้งค่า” เพื่อให้หุ้น/ตราสารหนี้อัปเดตอัตโนมัติทุกวัน</div></div>`;
  document.getElementById('view-market').innerHTML=`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
      <div style="flex:1;font-size:12.5px;color:#657280">ราคาตลาดอ้างอิง · ไม่ใช่ NAV จริงของ กบข.</div>
      <button class="mini-btn" onclick="refreshMarket()">↻ รีเฟรช</button></div>
    ${cards}${note}`;
}
function parseCsv(txt){
  const lines=txt.trim().split(/\r?\n/).filter(x=>x.length);
  if(lines.length<2)return null;
  const head=lines[0].split(',').map(s=>s.trim());
  const last=lines[lines.length-1].split(',');
  const o={};head.forEach((h,i)=>{const v=(last[i]||'').trim();o[h]=(v===''?null:(isNaN(+v)?v:+v));});
  return o;
}
async function fetchDaily(){
  if(!S.market.csvUrl)return;
  try{
    const r=await fetch(S.market.csvUrl,{cache:'no-store'});if(!r.ok)throw 0;
    const o=parseCsv(await r.text());if(!o)throw 0;
    S.market.daily=o;await save();renderMarket();
  }catch(e){/* เงียบ ไม่รบกวนผู้ใช้ */}
}
async function refreshMarket(){
  marketTried=false;
  await Promise.all([refreshGold(true),fetchDaily()]);
}
function refreshOnOpen(){ refreshGold(true); fetchDaily(); }
async function refreshGold(silent){
  try{
    const r=await fetch('https://xaus.com/api/');if(!r.ok)throw 0;const j=await r.json();
    const spot=j.spot_usd_oz||(j.xau&&j.xau.price);
    if(spot){S.market.goldPrev=S.market.gold;S.market.gold=Math.round(spot*100)/100;S.market.goldAt=nowTs();await save();renderMarket();}
    else throw 0;
  }catch(e){if(!silent)Swal.fire({toast:true,position:'top-end',icon:'error',title:'ดึงราคาทองสดไม่สำเร็จ',showConfirmButton:false,timer:1600});}
}

function renderSettings(){
  document.getElementById('view-settings').innerHTML=`
    <div class="slist">
      <button class="srow" onclick="changePin()"><span class="ic">🔑</span><span class="t">เปลี่ยน PIN<small>ตั้งรหัส 6 หลักใหม่</small></span><span class="chev">›</span></button>
      <button class="srow" onclick="toggleBio()"><span class="ic">👆</span><span class="t">ปลดล็อกด้วยลายนิ้วมือ/Face<small id="bioStatus">${(S.bio&&S.bio.enabled)?'เปิดอยู่ · แตะเพื่อปิด':'ปิดอยู่ · แตะเพื่อเปิด'}</small></span><span class="chev">${(S.bio&&S.bio.enabled)?'●':'○'}</span></button>
      <button class="srow" onclick="lockNow()"><span class="ic">🔒</span><span class="t">ล็อกแอปตอนนี้</span><span class="chev">›</span></button>
    </div>
    <div class="slist">
      <button class="srow" onclick="backupData()"><span class="ic">⬇️</span><span class="t">สำรองข้อมูล<small>ดาวน์โหลดไฟล์ .json</small></span><span class="chev">›</span></button>
      <button class="srow" onclick="restoreData()"><span class="ic">⬆️</span><span class="t">กู้คืนข้อมูล<small>แทนที่ข้อมูลทั้งหมดจากไฟล์</small></span><span class="chev">›</span></button>
      <button class="srow" onclick="editProfile()"><span class="ic">📅</span><span class="t">อายุราชการ/เกษียณ<small>ปีที่เหลือ · ช่วงลดหุ้น</small></span><span class="chev">›</span></button>
      <button class="srow" onclick="setCsv()"><span class="ic">🔗</span><span class="t">URL ข้อมูลตลาด (GAS)<small>สำหรับ Round 2</small></span><span class="chev">›</span></button>
    </div>
    <div class="slist">
      <button class="srow danger" onclick="resetAll()"><span class="ic">🗑️</span><span class="t">รีเซ็ตข้อมูลทั้งหมด<small>ลบทุกอย่างในเครื่อง</small></span><span class="chev">›</span></button>
    </div>
    <div style="text-align:center;font-size:12px;color:#94a3b8;margin-top:6px">ระบบติดตามการลงทุน กบข. · v1 · ข้อมูลเก็บในเครื่องนี้เท่านั้น</div>`;
}
async function changePin(){
  const r=await Swal.fire({title:'ตั้ง PIN ใหม่',html:`<input id="p1" class="swal-inp" inputmode="numeric" maxlength="6" type="password" placeholder="PIN ใหม่" style="text-align:center;letter-spacing:8px;font-size:20px">
    <input id="p2" class="swal-inp" inputmode="numeric" maxlength="6" type="password" placeholder="ยืนยัน" style="text-align:center;letter-spacing:8px;font-size:20px;margin-top:10px">`,
    showCancelButton:true,confirmButtonText:'บันทึก',cancelButtonText:'ยกเลิก',confirmButtonColor:'#0f766e',
    preConfirm:()=>{const a=document.getElementById('p1').value,b=document.getElementById('p2').value;
      if(!/^\d{6}$/.test(a)){Swal.showValidationMessage('ต้องเป็นตัวเลข 6 หลัก');return false;}
      if(a!==b){Swal.showValidationMessage('PIN ไม่ตรงกัน');return false;}return a;}});
  if(r.isConfirmed){S.pin=await makePin(r.value);await save();Swal.fire({toast:true,position:'top-end',icon:'success',title:'เปลี่ยน PIN แล้ว',showConfirmButton:false,timer:1400});}
}
async function toggleBio(){
  if(S.bio&&S.bio.enabled){
    const c=await Swal.fire({title:'ปิดปลดล็อกด้วยลายนิ้วมือ?',text:'จะกลับไปใช้ PIN อย่างเดียว',icon:'question',showCancelButton:true,confirmButtonText:'ปิด',cancelButtonText:'ยกเลิก',confirmButtonColor:'#be123c'});
    if(c.isConfirmed){S.bio={enabled:false,credId:null};await save();renderSettings();
      Swal.fire({toast:true,position:'top-end',icon:'success',title:'ปิดแล้ว',showConfirmButton:false,timer:1300});}
    return;
  }
  if(!await bioSupported()){Swal.fire({icon:'info',title:'อุปกรณ์นี้ยังใช้ไม่ได้',html:'<div style="font-size:13px;color:#657280">ต้องเปิดผ่าน https และมีเซนเซอร์ลายนิ้วมือ/Face + เบราว์เซอร์ที่รองรับ</div>',confirmButtonColor:'#0f766e'});return;}
  const pr=await Swal.fire({title:'ยืนยัน PIN ปัจจุบัน',input:'password',inputAttributes:{inputmode:'numeric',maxlength:6},inputPlaceholder:'PIN 6 หลัก',showCancelButton:true,confirmButtonText:'ถัดไป',cancelButtonText:'ยกเลิก',confirmButtonColor:'#0f766e'});
  if(!pr.isConfirmed)return;
  if(!await checkPin(pr.value||'',S.pin)){Swal.fire({icon:'error',title:'PIN ไม่ถูกต้อง',confirmButtonColor:'#0f766e'});return;}
  try{
    const credId=await registerBio();
    S.bio={enabled:true,credId};await save();renderSettings();
    Swal.fire({toast:true,position:'top-end',icon:'success',title:'เปิดปลดล็อกด้วยลายนิ้วมือแล้ว',showConfirmButton:false,timer:1800});
  }catch(e){Swal.fire({icon:'error',title:'ลงทะเบียนไม่สำเร็จ',html:'<div style="font-size:13px;color:#657280">อาจถูกยกเลิก หรืออุปกรณ์ไม่รองรับ</div>',confirmButtonColor:'#0f766e'});}
}
function backupData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='gpf-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);
  Swal.fire({toast:true,position:'top-end',icon:'success',title:'ดาวน์โหลดไฟล์สำรองแล้ว',text:'ไฟล์นี้มีรหัส PIN (แบบเข้ารหัส) เก็บให้ปลอดภัย',showConfirmButton:false,timer:2600});
}
async function restoreData(){
  const c=await Swal.fire({title:'กู้คืนข้อมูล?',html:'<div style="font-size:13px;color:#657280">ข้อมูลปัจจุบันทั้งหมดจะถูก<b>แทนที่</b>ด้วยไฟล์สำรอง</div>',icon:'warning',showCancelButton:true,confirmButtonText:'เลือกไฟล์',cancelButtonText:'ยกเลิก',confirmButtonColor:'#d97706'});
  if(!c.isConfirmed)return;
  const inp=document.createElement('input');inp.type='file';inp.accept='application/json,.json';
  inp.onchange=async()=>{const f=inp.files[0];if(!f)return;
    try{const txt=await f.text();const obj=JSON.parse(txt);
      if(!obj||typeof obj!=='object'||!('gpf'in obj)||!('mix'in obj))throw 0;
      S=Object.assign(defaultState(),obj);
      S.bio={enabled:false,credId:null};
      await save();
      await Swal.fire({icon:'success',title:'กู้คืนสำเร็จ',confirmButtonColor:'#0f766e'});
      if(S.pin)openLock();else enterApp();
    }catch(e){Swal.fire({icon:'error',title:'ไฟล์ไม่ถูกต้อง',confirmButtonColor:'#0f766e'});}};
  inp.click();
}
async function editProfile(){
  const p=S.profile;
  const r=await Swal.fire({title:'ตั้งค่าเกษียณ',html:`<div style="max-width:300px;margin:auto">
    <div class="swal-lbl">อายุราชการที่เหลือ (ปี)</div><input id="pf_y" type="number" class="swal-inp" value="${p.years}">
    <div class="swal-lbl">เริ่มลดหุ้นกี่ปีก่อนเกษียณ</div><input id="pf_d" type="number" class="swal-inp" value="${p.derisk}">
    <div class="swal-lbl">ปีปัจจุบัน (พ.ศ.)</div><input id="pf_b" type="number" class="swal-inp" value="${p.startBE}"></div>`,
    showCancelButton:true,confirmButtonText:'บันทึก',cancelButtonText:'ยกเลิก',confirmButtonColor:'#0f766e',
    preConfirm:()=>({years:+document.getElementById('pf_y').value||20,derisk:+document.getElementById('pf_d').value||7,startBE:+document.getElementById('pf_b').value||2568})});
  if(r.isConfirmed){S.profile=r.value;await save();Swal.fire({toast:true,position:'top-end',icon:'success',title:'บันทึกแล้ว',showConfirmButton:false,timer:1400});}
}
async function setCsv(){
  const r=await Swal.fire({title:'URL ข้อมูลตลาด (GAS CSV)',input:'url',inputValue:S.market.csvUrl||'',inputPlaceholder:'https://...',
    html:'<div style="font-size:12px;color:#94a3b8">ใส่ตอน Round 2 หลังตั้ง GAS เสร็จ</div>',
    showCancelButton:true,confirmButtonText:'บันทึก',cancelButtonText:'ยกเลิก',confirmButtonColor:'#0f766e'});
  if(r.isConfirmed){S.market.csvUrl=r.value||'';await save();Swal.fire({toast:true,position:'top-end',icon:'success',title:'บันทึกแล้ว',showConfirmButton:false,timer:1400});}
}
async function resetAll(){
  const r=await Swal.fire({title:'รีเซ็ตทั้งหมด?',html:'<div style="font-size:13px;color:#657280">จะลบข้อมูล เงินออม สัดส่วน ประวัติ และ PIN <b>ถาวร</b> แนะนำสำรองข้อมูลก่อน</div>',icon:'warning',showCancelButton:true,confirmButtonText:'ลบทั้งหมด',cancelButtonText:'ยกเลิก',confirmButtonColor:'#be123c',
    input:'text',inputPlaceholder:'พิมพ์ RESET เพื่อยืนยัน',preConfirm:v=>{if(v!=='RESET'){Swal.showValidationMessage('พิมพ์ RESET ให้ถูกต้อง');return false;}return true;}});
  if(r.isConfirmed){const db=await dbP;await new Promise(res=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').delete('state');tx.oncomplete=res;});
    S=null;await firstRun();}
}

boot();
</script>
